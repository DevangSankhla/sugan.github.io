name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_PAYU_MERCHANT_KEY: ${{ secrets.VITE_PAYU_MERCHANT_KEY }}
          VITE_PAYU_SALT: ${{ secrets.VITE_PAYU_SALT }}
          VITE_PAYU_BASE_URL: https://secure.payu.in/_payment
          # AI chat assistant — Cloudflare-hosted site calls the Firebase function directly (CORS-enabled).
          VITE_CHAT_ENDPOINT: https://us-central1-sugan-shop.cloudfunctions.net/chat

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sugan-github-io --commit-dirty=true
